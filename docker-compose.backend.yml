services:
  php:
    build:
      context: ./backend/docker
      dockerfile: Dockerfile
    container_name: php
    environment:
      PHP_MEMORY_LIMIT: 512M
    volumes:
      - ./backend/app:/var/www/app
    networks: [chatnet]

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    volumes:
      - ./backend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/app:/var/www/app
    ports:
      - "${NGINX_PORT}:80"
    networks: [chatnet]

networks:
  chatnet:
    external: true

