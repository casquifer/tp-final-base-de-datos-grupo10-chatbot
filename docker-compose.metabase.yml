services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - JAVA_TIMEZONE=America/Argentina/Buenos_Aires
    volumes:
      - ./metabase-data:/metabase-data
    networks:
      - metabase-net

networks:
  metabase-net:
    external: true
